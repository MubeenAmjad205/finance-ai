name = "finance-ai"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Workers AI Binding
[ai]
binding = "AI"

# Scheduled Cron Triggers (Uncomment if your Cloudflare account has available cron slots under 5)
# [triggers]
# crons = ["0 3 * * *"]

# Environment Variables (Non-secret placeholders)
[vars]
ENVIRONMENT = "production"
DEFAULT_CURRENCY = "PKR"
USER_TIMEZONE = "Asia/Karachi"

# Secrets required (Deploy via `npx wrangler secret put <KEY>`):
# - TELEGRAM_BOT_TOKEN
# - TELEGRAM_SECRET_TOKEN
# - TELEGRAM_CHAT_ID
# - MONGODB_DATA_API_KEY
# - MONGODB_APP_ID
# - MONGODB_DATABASE
# - DASHBOARD_PASSCODE
