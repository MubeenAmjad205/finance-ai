name = "finance-ai"
main = "src/index.ts"
compatibility_date = "2024-11-12"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Workers AI Binding
[ai]
binding = "AI"

# Environment Variables (Non-secret placeholders)
[vars]
ENVIRONMENT = "production"
DEFAULT_CURRENCY = "PKR"
ENABLE_AUTO_OCR = "true"

# Secrets required (Deploy via `wrangler secret put <KEY>`):
# - TELEGRAM_BOT_TOKEN
# - TELEGRAM_SECRET_TOKEN
# - MONGODB_DATA_API_KEY
# - MONGODB_APP_ID
# - MONGODB_DATABASE
# - DASHBOARD_PASSCODE
